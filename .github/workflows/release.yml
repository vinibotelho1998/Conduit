name: Build e Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Publicacoes em andamento precisam terminar; nunca interromper apos o push da versao.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    outputs:
      release_tag: v${{ steps.versao.outputs.numero }}
      release_commit: ${{ steps.commit.outputs.sha }}
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Analise estatica
        run: python -m pyflakes conduit tests packaging/launcher.py

      - name: Testes
        run: python tests/rodar.py

      - name: Preparar versao local
        id: versao
        # So grava no checkout. O commit so e enviado depois de compilar o instalador.
        run: |
          $conteudo = Get-Content -Path "conduit/__init__.py" -Raw
          $m = [regex]::Match($conteudo, '__version__\s*=\s*"(\d+)\.(\d+)\.(\d+)"')
          if (-not $m.Success) { throw "Nao achei __version__ no formato X.Y.Z" }
          $major = [int]$m.Groups[1].Value
          $minor = [int]$m.Groups[2].Value
          $patch = [int]$m.Groups[3].Value + 1
          $nova = "$major.$minor.$patch"
          $data = [DateTime]::UtcNow.ToString('yyyy-MM-dd')
          $conteudo = $conteudo -replace '__version__\s*=\s*"\d+\.\d+\.\d+"', "__version__ = `"$nova`""
          $conteudo = $conteudo -replace 'VERSION_DATE\s*=\s*"[^"]+"', "VERSION_DATE = `"$data`""
          Set-Content -Path "conduit/__init__.py" -Value $conteudo -NoNewline -Encoding utf8
          "numero=$nova" >> $env:GITHUB_OUTPUT

      - name: Build do app (PyInstaller)
        run: python -m PyInstaller packaging/Conduit.spec --noconfirm --distpath dist --workpath build

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compilar instalador
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.versao.outputs.numero }}" packaging\Conduit_Setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar o instalador" }
          if (-not (Test-Path -LiteralPath "dist/Conduit-Setup.exe")) { throw "Instalador ausente" }
          $hash = (Get-FileHash -LiteralPath "dist/Conduit-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Conduit-Setup.exe" | Set-Content -LiteralPath "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Guardar instalador verificado
        uses: actions/upload-artifact@v4
        with:
          name: Conduit-Windows
          path: |
            dist/Conduit-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Registrar versao compilada
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conduit/__init__.py
          git commit -m "chore: incrementa versao para ${{ steps.versao.outputs.numero }} [skip ci]"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao registrar a versao" }
          # Se main mudou durante o build, o push falha sem sobrescrever trabalho novo.
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "main mudou durante o build; execute novamente" }
          $commit = git rev-parse HEAD
          "sha=$commit" >> $env:GITHUB_OUTPUT

  linux:
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/linux.yml
    with:
      release_tag: ${{ needs.build.outputs.release_tag }}
      release_commit: ${{ needs.build.outputs.release_commit }}

  publish:
    needs: [build, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-assets-${{ needs.build.outputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Conduit-Windows
          path: windows
      - uses: actions/download-artifact@v4
        with:
          name: Conduit-Linux
          path: linux
      - name: Conferir e publicar os pacotes do mesmo commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.release_commit }}
        run: |
          (cd windows && sha256sum -c SHA256SUMS.txt)
          (cd linux && sha256sum -c *.sha256)
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > release.json; then
            if ! jq -e '.isDraft' release.json >/dev/null; then
              echo "A release $RELEASE_TAG já foi publicada." >&2
              exit 1
            fi
            test "$(jq -r '.targetCommitish' release.json)" = "$RELEASE_COMMIT"
          else
            gh release create "$RELEASE_TAG" --draft --target "$RELEASE_COMMIT" \
              --title "Conduit $RELEASE_TAG" --notes "Instalador Windows e pacote Linux x86-64 com SHA-256."
          fi
          gh release upload "$RELEASE_TAG" windows/* linux/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
